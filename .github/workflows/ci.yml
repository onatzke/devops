name: CI Pipeline

"on":
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4
      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Instalacja zależności
        run: npm ci
        working-directory: backend
      - name: Uruchomienie lintera
        run: npm run lint
        working-directory: backend

  test:
    name: Tests (Node ${{ matrix.node-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 18, 20, 22 ]
    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4
      - name: Konfiguracja Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Instalacja zależności
        run: npm ci
        working-directory: backend
      - name: Uruchomienie testów
        run: npm test
        working-directory: backend
      - name: Upload raportu testów
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: test-report-node${{ matrix.node-version }}
          path: backend/src/server.test.js
          retention-days: 7
      - name: Zapis podsumowania testów
        if: matrix.node-version == 20
        working-directory: backend
        run: |
          echo "## Test Results (Node ${{ matrix.node-version }})" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| Walidacja nazwy | passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Walidacja ceny | passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Obliczenia | passed |" >> $GITHUB_STEP_SUMMARY

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4
      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Instalacja zależności
        run: npm ci
        working-directory: backend
      - name: Uruchomienie buildu
        run: npm run build
        working-directory: backend
      - name: Zapis podsumowania buildu
        run: |
            echo "## Build Report" >> $GITHUB_STEP_SUMMARY
            echo "| Parametr | Status |" >> $GITHUB_STEP_SUMMARY
            echo "| Status | Success |" >> $GITHUB_STEP_SUMMARY
            echo "| Node version | ${{ env.NODE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY